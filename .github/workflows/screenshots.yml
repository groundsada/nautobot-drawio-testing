name: screenshots

# Renders diagrams/sc26.drawio and posts it on the PR.
#
# Format is SVG, not PNG. Measured on ubuntu-latest:
#   PNG  -> "Renderer process crashed" / UnknownVizError (needs canvas/GPU)
#   SVG  -> works, 95 KB, renders identically
# SVG is also better here: crisp at any zoom and small enough to inline.
#
# The image is committed to the PR branch, so it shows in the Files-changed
# view as an image diff AND can be linked from a comment.

on:
  pull_request:
    paths: ["diagrams/**"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: render to svg
        run: |
          mkdir -p diagrams/rendered
          docker run --rm -v "$PWD/diagrams:/data" \
            rlespinasse/drawio-desktop-headless:latest \
            -x -f svg -o /data/rendered/sc26.svg /data/sc26.drawio
          ls -l diagrams/rendered/

      - name: verify the render is real
        run: |
          f=diagrams/rendered/sc26.svg
          [ -s "$f" ] || { echo "::error::no svg produced"; exit 1; }
          python3 - "$f" <<'PY'
          import sys, re
          s = open(sys.argv[1]).read()
          # a real render contains shapes; an error page does not
          n = len(re.findall(r'<path|<rect|<text', s))
          print(f"  {len(s)} bytes, {n} drawable elements")
          assert n > 5, f"render looks empty ({n} elements)"
          assert "SCinet NOC" in s or "StarLight" in s, "labels missing"
          PY

      - name: commit the render to the PR branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagrams/rendered/sc26.svg
          if git diff --cached --quiet; then
            echo "::notice::no visual change"
            exit 0
          fi
          git commit -m "chore: update rendered diagram [skip ci]"
          git push

      - name: post it on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const url = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${branch}/diagrams/rendered/sc26.svg`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Rendered diagram\n\n<img src="${url}?t=${Date.now()}" width="760" alt="topology">\n\n_SVG rendered from \`diagrams/sc26.drawio\` in CI. Also committed to \`diagrams/rendered/sc26.svg\`._`
            });
