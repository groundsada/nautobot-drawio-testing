name: screenshots

# Posts before/after pictures on the PR so a reviewer can see what changed
# without opening drawio.
#
# Why this is not just "run drawio": there is no supported drawio CLI in the
# GitHub-hosted runners, and the desktop AppImage needs FUSE. The community
# action below wraps the same xvfb + electron approach in a container.
#
# Nautobot screenshots are NOT attempted here. The topology plugin renders
# client-side (vis.js), so a headless screenshot needs a browser driving the
# live UI -- it timed out at 60s through a port-forward when tested. What CI can
# show from Nautobot is the data, which is what /apply posts. Rendering the
# plugin view is left to the operator.

on:
  pull_request:
    paths: ["diagrams/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the drawio action always checks history (internal_push_before),
          # even in export mode, so a shallow clone fails with
          # "This is a shallow git repository"
          fetch-depth: 0

      # The action runs in a container with the workspace mounted, so an
      # absolute path like /tmp/render lands inside the container and vanishes.
      # Output into the repo instead, then verify the file exists before using it.
      - name: render the changed diagram
        uses: rlespinasse/drawio-export-action@v2
        with:
          path: diagrams/sc26.drawio
          format: png
          transparent: false
          output: diagrams/rendered
          scale: "2"

      - name: verify the render exists
        id: find
        run: |
          find . -name '*.png' -newermt '-5 minutes' -print | sed 's/^/  found: /'
          f=$(find diagrams/rendered -name '*.png' 2>/dev/null | head -1)
          if [ -z "$f" ]; then
            echo "::error::drawio produced no PNG -- the diagram may not render"
            exit 1
          fi
          echo "file=$f" >> "$GITHUB_OUTPUT"
          python3 -c "
          from struct import unpack
          d=open('$f','rb').read(33)
          w,h=unpack('>II',d[16:24])
          print(f'  rendered {w}x{h}')
          assert w > 100 and h > 100, 'render looks empty'
          "

      # Committing the PNG to the PR branch means GitHub shows it inline in the
      # Files-changed view as an image diff, which is better than an attachment.
      - name: commit the render to the PR branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p diagrams/rendered
          cp "${{ steps.find.outputs.file }}" diagrams/rendered/sc26.png
          git add diagrams/rendered/sc26.png
          if git diff --cached --quiet; then
            echo "no visual change"
          else
            git commit -m "chore: update rendered diagram [skip ci]"
            git push
          fi

      - name: post the image on the PR
        uses: actions/github-script@v7
        with:
          script: |
            // the previous step committed the PNG to the PR branch, so the raw
            // URL on that branch is stable and renders inline in the comment
            const branch = context.payload.pull_request.head.ref;
            const url = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${branch}/diagrams/rendered/sc26.png?cachebust=${Date.now()}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Rendered diagram\n\n![diagram](${url})\n\n_Rendered headlessly from \`diagrams/sc26.drawio\`. If this is blank, the diagram failed to render._`
            });
