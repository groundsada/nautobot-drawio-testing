name: screenshots

# Renders diagrams/sc26.drawio headlessly and posts the image on the PR.
#
# Uses drawio-desktop directly rather than a wrapper action. Three attempts at
# rlespinasse/drawio-export-action failed for reasons unrelated to this repo:
#   * output paths resolve inside the action's container, not the workspace
#   * it inspects git history even in export mode ("shallow git repository")
#   * 'export' is not a valid action-mode despite the docs implying otherwise
# Driving xvfb + the AppImage directly is fewer moving parts and is exactly
# what works locally.

on:
  pull_request:
    paths: ["diagrams/**"]

permissions:
  contents: write
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: install drawio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libasound2t64 libgbm1 libnss3 \
            libxss1 libgtk-3-0 || sudo apt-get install -y -qq xvfb libasound2 \
            libgbm1 libnss3 libxss1 libgtk-3-0
          VER=$(curl -s https://api.github.com/repos/jgraph/drawio-desktop/releases/latest \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].lstrip("v"))')
          echo "drawio $VER"
          curl -sL -o /tmp/drawio.AppImage \
            "https://github.com/jgraph/drawio-desktop/releases/download/v${VER}/drawio-amd64-${VER}.AppImage"
          chmod +x /tmp/drawio.AppImage
          /tmp/drawio.AppImage --appimage-extract >/dev/null
          echo "extracted: $(ls squashfs-root/drawio-desktop | head -1)"

      - name: render
        run: |
          xvfb-run -a ./squashfs-root/drawio-desktop \
            --no-sandbox --disable-gpu --export --format png --scale 2 \
            --output diagrams/rendered diagrams/sc26.drawio
          ls -l diagrams/rendered/ || true

      - name: verify the render is real
        id: check
        run: |
          f=$(find diagrams/rendered -name '*.png' | head -1)
          [ -n "$f" ] || { echo "::error::no PNG produced"; exit 1; }
          python3 -c "
          from struct import unpack
          d=open('$f','rb').read(33)
          assert d[:4]==b'\x89PNG', 'not a PNG'
          w,h=unpack('>II',d[16:24])
          print(f'rendered {w}x{h}')
          assert w>200 and h>200, f'render looks empty: {w}x{h}'
          "
          echo "file=$f" >> "$GITHUB_OUTPUT"

      - name: commit the render
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagrams/rendered
          if git diff --cached --quiet; then echo "no visual change"; exit 0; fi
          git commit -m "chore: update rendered diagram [skip ci]"
          git push

      - name: post the image
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const url = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${branch}/diagrams/rendered/sc26.png`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Rendered diagram\n\n![diagram](${url}?t=${Date.now()})\n\n_Rendered from \`diagrams/sc26.drawio\` in CI._`
            });
