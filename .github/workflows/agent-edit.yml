name: agent edit

# Comment on a PR to change the network: drawing and Nautobot together.
#
#   /draw add a 400G circuit WC99 between SCinet NOC and Caltech Booth 5438
#   /draw rename hpc-sw-1 to hpc-n9k-1 and move star-cr6 to the Ciena booth
#
# One run: the agent edits diagrams/sc26.drawio, the edit is verified (tests,
# lossless check, drawio-skill lint), rendered, committed to the PR branch,
# then the committed drawing is synced to Nautobot and read back. The reply
# shows both: the rendered drawing and a diagram built from Nautobot's rows.
# The drawing stays the source: Nautobot is always written FROM the committed
# file, never from the model's plan, so the two cannot disagree.
#
# Nautobot is written only when variable NAUTOBOT_SYNC_ENABLED is 'true' and
# secret KUBECONFIG_B64 is set; otherwise the drawing is still edited.
#
# Requires secret NRP_AUTH_TOKEN and variable NRP_BASE_URL. If they are absent
# the job says so and exits cleanly rather than failing every comment.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  statuses: write

# shared with screenshots.yml so the two never push to the same PR branch at once
concurrency:
  group: diagram-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  edit:
    # only a PR comment starting with /draw, by someone with write access
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/draw ') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: check the agent is configured
        id: cfg
        env:
          TOKEN: ${{ secrets.NRP_AUTH_TOKEN }}
          BASE: ${{ vars.NRP_BASE_URL }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$BASE" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NRP_AUTH_TOKEN / NRP_BASE_URL not set; skipping"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.configured == 'true'
        with:
          ref: ${{ github.event.issue.pull_request.head.ref || github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.configured == 'true'
        with: {python-version: "3.12"}

      - name: check out the PR branch
        if: steps.cfg.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr checkout ${{ github.event.issue.number }}

      - name: run the agent
        if: steps.cfg.outputs.configured == 'true'
        id: agent
        env:
          NRP_AUTH_TOKEN: ${{ secrets.NRP_AUTH_TOKEN }}
          NRP_BASE_URL: ${{ vars.NRP_BASE_URL }}
          NRP_ANTHROPIC_MODEL: ${{ vars.NRP_MODEL || 'deepseek-v4-flash' }}
          INSTRUCTION: ${{ github.event.comment.body }}
        run: |
          # strip the leading '/draw ' command word
          python3 - <<'PY'
          import os, subprocess, sys
          import re
          m = re.search(r"^\s*/draw\s+(.+)$", os.environ["INSTRUCTION"], re.M)
          if not m:
              print("no /draw line in the comment; nothing to do")
              sys.exit(0)
          instruction = m.group(1).strip()
          r = subprocess.run([sys.executable, "tools/llm_edit.py",
                              "--drawio", "diagrams/sc26.drawio",
                              "--instruction", instruction,
                              "-o",       "diagrams/sc26.drawio",
                              "--json",   "/tmp/plan.json"],
                             capture_output=True, text=True)
          print(r.stdout)
          print(r.stderr, file=sys.stderr)
          # the change log and any refusal go into the PR reply
          open("/tmp/edit.log", "w").write(r.stdout + r.stderr)
          sys.exit(r.returncode)
          PY

      - name: verify the edit before committing
        if: steps.cfg.outputs.configured == 'true' && success()
        run: |
          python3 tools/test_pipeline.py
          python3 tools/tag_drawio.py check diagrams/sc26.drawio diagrams/sc26.drawio
          python3 tools/sync_nautobot.py --drawio diagrams/sc26.drawio \
            --dry-run --skip-cluster
          # structural lint from Agents365-ai/drawio-skill: errors (dangling
          # edges, broken parents, duplicate ids) fail the edit; warnings are
          # reported in the reply
          python3 tools/vendor/drawio_skill/validate.py diagrams/sc26.drawio --score \
            | tee /tmp/lint.txt

      # Rendered here rather than left to screenshots.yml: a push made with
      # GITHUB_TOKEN does not trigger other workflows, so the agent's own
      # commit would never get a screenshot. SVG because PNG crashes the
      # headless renderer on hosted runners.
      - name: render the edited diagram
        if: steps.cfg.outputs.configured == 'true' && success()
        run: |
          mkdir -p diagrams/rendered
          docker run --rm -v "$PWD/diagrams:/data" \
            rlespinasse/drawio-desktop-headless:latest \
            -x -f svg -b 24 -o /data/rendered/sc26.svg /data/sc26.drawio
          python3 - diagrams/rendered/sc26.svg <<'PY'
          import sys, re
          s = open(sys.argv[1]).read()
          rects, paths = len(re.findall(r'<rect', s)), len(re.findall(r'<path', s))
          print(f"  {len(s)} bytes, {rects} rects, {paths} paths")
          assert rects >= 5, f"only {rects} rects -- render looks blank"
          PY

      - name: commit to the PR branch
        id: commit
        if: steps.cfg.outputs.configured == 'true' && success()
        env:
          # via env, never ${{ }} inside run: -- the comment is user text and
          # interpolating it into the script is a shell-injection hole
          COMMENT: ${{ github.event.comment.body }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # stage first: `git diff` without --cached reports nothing for a
          # change that has not been added yet, which made this check always
          # say "no change" even when the agent had edited the file
          git add diagrams/sc26.drawio diagrams/rendered/sc26.svg
          if git diff --cached --quiet; then
            echo "::notice::agent produced no change to the diagram"
            exit 0
          fi
          git commit -m "agent: $(printf '%s' "$COMMENT" | head -1 | cut -c1-72)"
          # rebase in case anything landed meanwhile; on a conflicting render
          # keep this run's (in a rebase, "theirs" is the commit being replayed)
          git pull --rebase -X theirs origin "$(git branch --show-current)"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Written from the COMMITTED drawing, so Nautobot matches what is on
      # the branch even if the model's plan said something else.
      - name: write to Nautobot and read it back
        id: nautobot
        if: >
          steps.cfg.outputs.configured == 'true' && success() &&
          steps.commit.outputs.sha != '' && vars.NAUTOBOT_SYNC_ENABLED == 'true'
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          umask 077
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          python3 tools/tag_drawio.py tag diagrams/sc26.drawio -o /tmp/tagged.drawio
          python3 tools/sync_nautobot.py --drawio /tmp/tagged.drawio --apply \
            --result /tmp/result.json
          # second run must change nothing: proves the write converged
          python3 tools/sync_nautobot.py --drawio /tmp/tagged.drawio --apply --expect-noop
          python3 tools/nautobot_view.py /tmp/result.json > /tmp/nautobot.md

      - name: report back on the PR
        if: always() && steps.cfg.outputs.configured == 'true'
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.agent.outcome }}
          COMMITTED: ${{ steps.commit.outcome }}
          SHA: ${{ steps.commit.outputs.sha }}
          NAUTOBOT: ${{ steps.nautobot.outcome }}
        with:
          script: |
            const ok = process.env.OUTCOME === 'success' && process.env.COMMITTED === 'success';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // bot commits need manual approval before other workflows run on
            // them, so the PR showed no checks at all; record what this run
            // verified (tests + lossless check, before committing) on the sha
            if (ok && process.env.SHA) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner, repo: context.repo.repo,
                sha: process.env.SHA, state: 'success', target_url: run,
                context: 'agent-edit / verified',
                description: 'tests, lossless check and render passed before commit'});
            }
            const fs = require('fs');
            const read = (f, n) => fs.existsSync(f) ? fs.readFileSync(f, 'utf8').slice(0, n) : '';
            let summary = '';
            try { summary = JSON.parse(read('/tmp/plan.json', 100000)).summary || ''; } catch (e) {}
            // the tool's own change log, not the model's claims about it
            const log = read('/tmp/edit.log', 4000).split('\n')
              .filter(l => /^\s+[-!]/.test(l)).join('\n');
            const lint = read('/tmp/lint.txt', 4000).split('\n').filter(l => /^score:|error\(s\)/.test(l)).join(' · ');
            const plan = read('/tmp/plan.json', 6000) || '(no plan produced)';
            // pinned to the commit sha so the image never shows a cached older render
            const img = process.env.SHA
              ? `<img src="https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${process.env.SHA}/diagrams/rendered/sc26.svg" width="760" alt="diagram after this edit">`
              : '';
            const nb = process.env.NAUTOBOT === 'success'
              ? `#### Nautobot, read back after the write\n\n${read('/tmp/nautobot.md', 20000)}`
              : process.env.NAUTOBOT === 'failure'
                ? `#### Nautobot\n\n:x: The drawing was committed but the Nautobot write failed. See the [workflow run](${run}); comment \`/apply\` to retry.`
                : `#### Nautobot\n\nNot written (sync is not enabled for this repo).`;
            const body = ok && !process.env.SHA
              ? `### No change\n\nThe plan applied but left the drawing identical, so nothing was committed or written.\n\n\`\`\`\n${log}\n\`\`\``
              : ok
              ? [`### Drawing and Nautobot updated`, summary && `> ${summary}`,
                 '```\n' + log + '\n```',
                 `#### Drawing (\`${process.env.SHA.slice(0, 7)}\`)`, img,
                 lint && `<sub>drawio-skill lint: ${lint}</sub>`, nb,
                 `<details><summary>plan</summary>\n\n\`\`\`json\n${plan}\n\`\`\`\n</details>`,
                 `Comment \`/draw <change>\` again to keep editing.`].filter(Boolean).join('\n\n')
              : `### Edit not applied\n\n\`\`\`\n${read('/tmp/edit.log', 3000) || 'no output'}\n\`\`\`\n\nNothing was committed and Nautobot was not touched. See the [workflow run](${run}).`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
