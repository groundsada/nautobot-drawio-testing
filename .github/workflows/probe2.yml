name: probe2
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: render the tiny fixture
        run: |
          docker run --rm -v "$PWD/demo:/data" \
            rlespinasse/drawio-desktop-headless:latest \
            -x -f png -s 2 -o /data/fix.png /data/topology.demo.drawio || echo "FIXTURE FAILED"
          ls -l demo/fix.png 2>/dev/null || echo "(no fixture output)"
      - name: try svg instead of png
        run: |
          docker run --rm -v "$PWD/diagrams:/data" \
            rlespinasse/drawio-desktop-headless:latest \
            -x -f svg -o /data/sc26.svg /data/sc26.drawio || echo "SVG FAILED"
          ls -l diagrams/sc26.svg 2>/dev/null || echo "(no svg output)"
