name: apply to nautobot

# Applies diagram changes to Nautobot. Two ways to trigger:
#
#   1. Open a PR touching diagrams/ -- a plan is posted as a PR comment.
#      Nothing is written to Nautobot.
#   2. Comment "/apply" on that PR -- the plan is applied.
#   3. Or merge to main -- applied automatically.
#
# The plan is always shown before anything changes, because this pipeline can
# delete rows: a diagram with fewer circuits prunes the difference.

on:
  pull_request:
    paths: ["diagrams/**"]
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths: ["diagrams/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Runs anywhere. Proves the diagram is well-formed and shows the diff.
  plan:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/apply'))
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # for issue_comment we need the PR head, not main
          ref: ${{ github.event.pull_request.head.sha || github.event.issue.pull_request.url }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: regression tests
        run: python3 tools/test_pipeline.py

      - name: tag and verify lossless
        run: |
          python3 tools/tag_drawio.py tag diagrams/sc26.drawio -o /tmp/tagged.drawio
          python3 tools/tag_drawio.py check diagrams/sc26.drawio /tmp/tagged.drawio

      - name: extract model
        id: plan
        run: |
          python3 tools/sync_nautobot.py --drawio /tmp/tagged.drawio \
            --dry-run --skip-cluster --json /tmp/model.json | tee /tmp/plan.txt
          python3 - <<'PY'
          import json, os
          m = json.load(open("/tmp/model.json"))
          lines = ["### Diagram plan", ""]
          lines.append(f"- locations: {len(m['locations'])}")
          lines.append(f"- circuits: {len(m['circuits'])}")
          lines.append(f"- hops: {sum(len(c['hops']) for c in m['circuits'].values())}")
          lines.append(f"- sub-ranges: {sum(len(c['subranges']) for c in m['circuits'].values())}")
          body = "\n".join(lines)
          open("/tmp/comment.md", "w").write(body)
          print(body)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("has_changes=true\n")
          PY

      - name: post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/comment.md', 'utf8')
              + '\n\n_Nothing has been applied. Comment `/apply` on this PR to write these changes to Nautobot._';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # Writes to Nautobot. Needs a cluster, so it only runs when configured.
  apply:
    needs: plan
    if: >
      vars.NAUTOBOT_SYNC_ENABLED == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '/apply')))
    runs-on: ubuntu-latest
    environment: nautobot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: tag
        run: python3 tools/tag_drawio.py tag diagrams/sc26.drawio -o /tmp/tagged.drawio

      - name: apply
        run: python3 tools/sync_nautobot.py --drawio /tmp/tagged.drawio --apply

      - name: verify idempotent (second run must create nothing)
        run: python3 tools/sync_nautobot.py --drawio /tmp/tagged.drawio --apply --expect-noop
